name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck + test + build
    runs-on: ubuntu-latest
    env:
      # Build-time only. Real deployments supply their own values; middleware
      # falls back to decode+expiry checks when the verification secrets are
      # absent, so CI does not need real ones.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_ENABLE_MSW: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx jest --ci

      - name: Build
        run: npx next build

  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    # Advisory until the existing lint debt is paid down; once clean, drop
    # continue-on-error to turn this into a real gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: npx next lint

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Blocking. Critical is the bar we hold: CVE-2025-29927 (Next.js
      # middleware authorization bypass) sat here undetected while every route
      # guard in the app depends on middleware running.
      - name: Audit production dependencies (critical - blocking)
        run: pnpm audit --prod --audit-level critical

      # Advisory. The remaining highs are all Next.js issues fixed only in
      # 15.x. Five do not apply to this app (no Server Actions, no rewrites,
      # no i18n Pages Router, no WebSocket upgrades); the rest are DoS-class
      # against React Server Components. Clearing them needs the Next 15
      # migration (React 19, async request APIs), which is planned separately.
      - name: Audit production dependencies (high - advisory)
        continue-on-error: true
        run: pnpm audit --prod --audit-level high
